<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>비전 어시스트 · 작업 준비</title><link rel="stylesheet" href="assist.css"><link rel="stylesheet" href="intake.css"><body>
<header><a class="brand" href="assist.html"><span class="brand-mark">v</span><span><strong>비전 어시스트</strong><small>VISION ASSIST</small></span></a><button id="settings" aria-label="기본정보 설정">⚙</button></header>
<main><nav><a href="assist.html">‹ 처음으로</a><span id="mode"></span></nav><h1>이번 건 준비</h1><div class="toolbar" id="steps"><button class="button active" id="step-data">1. 자료</button><button class="button" id="step-photos">2. 사진·PDF</button></div><div id="data-step">
<div class="toolbar"><button id="folder" class="button green">폴더 선택</button><button id="excel" class="button">엑셀 불러오기</button><button id="template" class="button">양식 받기</button></div><input hidden type="file" id="folder-input" webkitdirectory multiple><input hidden type="file" id="excel-input" accept=".xlsx"><p id="folder-name" class="muted">폴더의 엑셀과 사진·PDF를 불러옵니다.</p><select id="workbooks" hidden aria-label="읽을 엑셀 선택"></select>
<section class="panel"><h2>이번 건 정보</h2><div id="basic-primary" class="fields-grid"></div><details><summary>기본정보·추가 항목</summary><div id="basic-more" class="fields-grid"></div></details><div class="toolbar"><button id="find-previous" class="button">같은 실적 찾기</button><span id="previous-title"></span></div><div id="items"></div><button id="add-item" class="button">＋ 품목 추가</button></section>
<section id="new-data" class="panel" hidden><h2>제품 자료</h2><div id="tables"></div></section>
</div><div id="photos-step" hidden><section class="panel"><h2>사진·PDF 선택</h2><div id="roles" class="toolbar"></div><p class="muted" id="photo-role-hint"></p><div id="gallery"></div><p id="photo-summary"></p><button id="extra-picker" class="button">＋ 파일 추가</button><input hidden id="extra-files" type="file" multiple accept=".png,.jpg,.jpeg,.bmp,.gif,.tif,.tiff,.pdf"><div id="selected-files"></div></section>
</div><div id="status" class="status" role="status">엑셀을 불러오거나 직접 입력하세요.</div><button id="start" class="button green wide">입력 시작</button><div class="toolbar"><button id="save" class="button">작업 저장</button><button id="resume" class="button">저장한 작업</button><button id="guide" class="button">GPT 정리 지침</button></div>
<details><summary>진행 기록</summary><ol id="log"></ol><button id="inspect" class="button">신규 화면 연결 진단</button><button id="export-log" class="button">기록 저장</button></details></main>
<dialog id="dialog"><div id="dialog-body"></div><button id="dialog-close" class="button">닫기</button></dialog><script type="module" src="intake.js"></script></body></html>
