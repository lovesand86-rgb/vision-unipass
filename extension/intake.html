<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>비전 어시스트 · 이번 건 준비</title><link rel="stylesheet" href="assist.css"><link rel="stylesheet" href="intake.css"><body>
<header><a class="brand" href="assist.html"><span class="brand-mark">v</span><span><strong>비전 어시스트</strong><small>VISION ASSIST</small></span></a><button id="settings" aria-label="회사 기본정보">⚙</button></header>
<main><nav><a href="assist.html">‹ 처음으로</a><span id="mode"></span></nav><h1>이번 건 준비</h1><p class="muted">저장한 제품을 고르고, 이번에 달라진 내용만 입력하세요.</p>
<div id="continue-draft" hidden class="toolbar"><span>작성 중인 작업이 있습니다.</span><button id="continue-last" class="button">이어서 준비</button></div>
<div class="toolbar" id="steps"><button class="button active" id="step-data">1. 제품·선적</button><button class="button" id="step-photos">2. 사진·PDF</button></div><div id="data-step">
<section class="panel"><h2>어느 화주의 제품인가요?</h2><div class="fields-grid"><label>화주<select id="owner-select" aria-label="저장한 화주"></select></label><label>제품<select id="product-select" aria-label="저장한 제품"></select></label></div><input id="product-search" aria-label="제품 찾기" placeholder="제품명·제조업소로 찾기"><p id="profile-summary" class="muted"></p><div class="toolbar"><button id="new-product" class="button">＋ 제품 등록</button><button id="save-current" class="button" hidden>현재 자료를 제품으로 저장</button><button id="manage-library" class="button">기본정보 관리</button></div></section>
<section class="panel"><h2>이번 선적</h2><div class="toolbar"><button id="folder" class="button green">폴더 선택</button><button id="extra-picker" class="button">사진·PDF 추가</button></div><input hidden type="file" id="folder-input" webkitdirectory multiple><input hidden id="extra-files" type="file" multiple accept=".png,.jpg,.jpeg,.bmp,.gif,.tif,.tiff,.pdf"><p id="folder-name" class="muted">선적서류와 사진이 있는 폴더를 선택하세요.</p><select id="workbooks" hidden aria-label="읽을 엑셀 선택"></select>
<div id="basic-primary" class="fields-grid"></div><div id="shipment-cargo" class="fields-grid"></div><details><summary>이번 건 연락처·추가 정보</summary><div id="shipment-more" class="fields-grid"></div></details><div id="items"></div><div id="routine-labels"></div><div class="toolbar"><button id="find-previous" class="button">유니패스 실적 값 조회</button><span id="previous-title"></span></div></section>
<details id="registration" class="panel"><summary>화주·제품 등록정보 수정</summary><p class="muted">처음 한 번 등록하면 다음부터 선택만 하면 됩니다. 엑셀로 등록하거나 아래에서 직접 입력하세요.</p><div class="toolbar"><button id="excel" class="button">엑셀로 등록</button><button id="template" class="button">양식 받기</button><button id="guide" class="button">GPT 정리 지침</button></div><input hidden type="file" id="excel-input" accept=".xlsx"><div id="basic-more" class="fields-grid"></div><div id="product-items"></div><button id="add-item" class="button">＋ 품목·규격 추가</button><section id="new-data"><h2>제품 상세자료</h2><div id="tables"></div></section><button id="save-profile" class="button green wide">화주·제품 저장</button></details>
</div><div id="photos-step" hidden><section class="panel"><h2>사진·PDF 선택</h2><div id="roles" class="toolbar"></div><p class="muted" id="photo-role-hint"></p><div id="gallery"></div><p id="photo-summary"></p><div id="selected-files"></div></section></div>
<div id="status" class="status" role="status">화주와 제품을 선택하거나 제품을 한 번 등록해주세요.</div><button id="start" class="button green wide">입력 시작</button><div class="toolbar"><button id="save" class="button">작업 저장</button><button id="resume" class="button">저장한 작업</button><button id="next-job" class="button">다음 건 준비</button></div><p id="draft-status" class="muted" aria-live="polite"></p>
<details><summary>진행 기록</summary><ol id="log"></ol><button id="inspect" class="button">신규 화면 연결 진단</button><button id="export-log" class="button">기록 저장</button></details></main>
<dialog id="dialog"><div id="dialog-body"></div><button id="dialog-close" class="button">닫기</button></dialog><input hidden id="library-file" type="file" accept=".json"><script type="module" src="intake.js"></script></body></html>
