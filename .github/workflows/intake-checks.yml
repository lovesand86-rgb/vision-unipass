name: Intake preview checks
on:
  pull_request:
    paths: ['extension/**', 'tests/**', 'docs/intake-template.xlsx', '.github/workflows/intake-checks.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/*.test.mjs
      - run: node tests/intake-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-preview-screenshots
          path: artifacts/screenshots/15-folder-intake.png
