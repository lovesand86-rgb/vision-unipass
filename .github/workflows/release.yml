name: Release Windows
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-windows
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.427'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read release version
        shell: pwsh
        run: |
          $version = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
      - name: Check model and updater recovery
        shell: pwsh
        run: |
          node --test --test-isolation=none tests/model.test.mjs tests/sequence.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/CoreTests.csproj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package and build Windows executable
        shell: pwsh
        run: |
          python tools/package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish host/VisionAssist.csproj -c Release -r win-x64 --self-contained true -p:RuntimeFrameworkVersion=8.0.33 -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare downloadable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item artifacts/windows/VisionAssist.exe "dist/VisionAssist-${env:RELEASE_VERSION}-win-x64.exe"
          Copy-Item artifacts/update.json,artifacts/vision-extension-core.zip,release/START-HERE.ko.txt,release/VisionAssist-home.png,release/VisionAssist-workspace.png dist/
          git archive --format=zip --output="dist/VisionAssist-${env:RELEASE_VERSION}-source.zip" HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content -Encoding utf8NoBOM dist/SHA256SUMS.txt
      - name: Upload and publish reviewed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --draft --target "${{ github.sha }}" --title "비전 어시스트 $env:RELEASE_VERSION" --notes-file release/NOTES.ko.md
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } elseif (-not ($existing | ConvertFrom-Json).isDraft) {
            throw 'This version is already public. Bump the version instead of replacing published files.'
          }
          gh release edit $env:RELEASE_TAG --target "${{ github.sha }}" --notes-file release/NOTES.ko.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $assets = (Get-ChildItem dist -File).FullName
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($release.assets.Count -ne 8) { throw 'Expected eight release assets.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
